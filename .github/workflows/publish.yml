name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write # required for npm + JSR OIDC trusted publishing
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds

      - name: Verify release tag matches package.json version
        run: |
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Release tag '${{ github.event.release.tag_name }}' does not match package.json version '$pkg'"
            exit 1
          fi

      - run: npm ci
      - run: npm install -g npm@latest # npm >= 11.15.0 required for staged publishing

      # prepublishOnly runs clean -> build -> test -> typecheck.
      # Stages the release; a maintainer approves it with 2FA on npmjs.com
      # (Staged Packages tab) or via `npm stage approve <id>`.
      - run: npm stage publish

  publish-jsr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify release tag matches jsr.json version
        run: |
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"
          pkg="$(node -p "require('./jsr.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Release tag '${{ github.event.release.tag_name }}' does not match jsr.json version '$pkg'"
            exit 1
          fi

      - run: npm ci # resolve npm: specifiers for type checking
      - run: npx jsr publish # OIDC-authenticates via id-token; skips if version exists
